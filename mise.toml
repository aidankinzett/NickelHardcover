[env]
NH_QT_MAJOR = '6'
VERSION = '{{ exec(command="git describe --tags --long --dirty 2>/dev/null") }}'

[tasks.build]
description = 'Build NickelHardcover.zip within the Qt 6 docker container'
depends = ['toolchain build::package']

[tasks.'build::codegen']
description = 'Generate QT deserialization code from the rust structs'
dir = 'cli/qt_codegen'
run = 'cargo run -q -- ../src/messages.rs > ../../hook/src/messages.h'

[tasks.'build::cli']
description = 'Build the rust CLI'
dir = 'cli'
run = 'cargo build --release --target=arm-unknown-linux-gnueabihf'

[tasks.'build::hook']
description = 'Build the nickel Qt 6 plugin (Kobo.tgz)'
depends = ['build::codegen']
dir = 'hook'
run = 'make all kobo'

[tasks.'build::package']
description = 'Package the plugin, CLI and example config into NickelHardcover.zip'
depends = ['build::hook', 'build::cli']
run = '''
#!/usr/bin/env sh
set -e
rm -rf dist NickelHardcover.zip
mkdir -p dist/.kobo dist/.adds/NickelHardcover
cp hook/Kobo.tgz                                                          dist/.kobo/
cp cli/target/arm-unknown-linux-gnueabihf/release/nickel-hardcover-cli    dist/.adds/NickelHardcover/cli
cp hook/res/config_example.ini                                            dist/.adds/NickelHardcover/
cd dist
zip -qr ../NickelHardcover.zip .kobo .adds
cd ..
rm -r dist
unzip -l NickelHardcover.zip
'''

[tasks.clean]
description = 'Remove all build artifacts'
run = [
  'cd hook && make clean',
  'cd cli && cargo clean',
  'rm -rfv dist NickelHardcover.zip hook/Kobo.tgz',
]

[tasks.dump]
description = 'Dump raw and demangled symbols from a libnickel.so file'
usage = 'arg "<file>" help="The shared object file to dump"'
run = [
  'nm -D --demangle "{{usage_file}}" > "{{usage_file}}".log',
  'nm -D "{{usage_file}}" > "{{usage_file}}"-raw.log'
]

[tasks.format]
description = 'Format all source files'
run = [
  'cd cli && cargo fmt',
  'clang-format -i hook/src/**/*.cc hook/src/*.cc',
  'clang-format -i hook/src/**/*.h hook/src/*.h'
]

# Kobo devices ship with a broken SSH config that uses ForceCommand to
# override client commands, causing non-interactive SSH to fail. Fix this by
# commenting out the offending line in `/etc/ssh/sshd_config`.
# > sed -i '/ForceCommand/s/^/#/' /etc/ssh/sshd_config

[tasks.install]
description = 'Copy the built plugin and CLI onto a Kobo device over SSH and reboot it'
depends = ['build']
env = {
  KOBO_SERVER = { required = true },
  KOBO_PASSWORD = { required = true, redact = true }
}
# No scp or sftp on Kobo devices
run = [
  'sshpass -p "$KOBO_PASSWORD" ssh "root@$KOBO_SERVER" "mkdir -p /mnt/onboard/.adds/NickelHardcover"',
  'pv cli/target/arm-unknown-linux-gnueabihf/release/nickel-hardcover-cli | sshpass -p "$KOBO_PASSWORD" ssh "root@$KOBO_SERVER" "cat > /mnt/onboard/.adds/NickelHardcover/cli && chmod +x /mnt/onboard/.adds/NickelHardcover/cli"',
  'pv hook/Kobo.tgz | sshpass -p "$KOBO_PASSWORD" ssh "root@$KOBO_SERVER" "cat > /mnt/onboard/.kobo/Kobo.tgz && reboot"',
]

[tasks.logs]
description = 'Read logs over SSH'
env = {
  KOBO_SERVER = { required = true },
  KOBO_PASSWORD = { required = true, redact = true }
}
run = 'sshpass -p "$KOBO_PASSWORD" ssh -t "root@$KOBO_SERVER" "logread -F" | grep --line-buffered NickelHardcover'

[tasks.schema]
description = 'Fetch Hardcover.app GraphQL schema'
tools.node = "26"
env = { HARDCOVER_AUTHORIZATION = { required = true, redact = true } }
run = [
  'npx get-graphql-schema',
  'npx get-graphql-schema --header "authorization=$HARDCOVER_AUTHORIZATION" https://api.hardcover.app/v1/graphql > cli/src/graphql/schema.graphql'
]

[tasks.toolchain]
description = 'Run mise tasks within the Qt 6 docker container'
run = 'docker run --volume="$PWD:$PWD" --workdir="$PWD" -u $(id --user):$(id --group) --rm -e "TERM=$TERM" -it nickelhardcover-builder mise run'

[tasks.'toolchain::build']
description = 'Build the Qt 6 toolchain and build environment docker images (takes a while)'
run = [
  'docker buildx build toolchain/qt6 --tag nickelhardcover-qt6-toolchain',
  'docker buildx build . --tag nickelhardcover-builder',
]
