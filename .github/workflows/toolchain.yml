# Builds the Qt 6 Kobo toolchain image (compiles Qt from source, 30-60+ minutes) and publishes it to GitHub's container
# registry so the release workflow can reuse it. Runs when the toolchain changes, or manually. Run it once before the
# first release.
name: Toolchain image

on:
  push:
    branches: [main]
    paths:
      - toolchain/qt6/**
      - .github/workflows/toolchain.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: toolchain
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # The Qt build needs far more than the ~14 GB free on a stock runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nickelhardcover-qt6-toolchain" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: toolchain/qt6
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
